
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
   body { text-align: center; background-color: #f0f8ff; font-family: Arial; } 
   input { width: 300px; padding: 10px; border: 2px solid #6c63ff; border-radius: 5px; } 
   button { padding: 8px 12px; margin: 5px; border: none; border-radius: 5px; background-color: #6c63ff; color: white; cursor: pointer; } 
   button:hover { background-color: #4b45b2; }
    li { margin: 10px; padding: 8px; }
     #nm { color: red; }
    </style>
</head>
<body>

    <input type="text" id="input" placeholder="Enter task"><br><br>
    <p id="nm"></p>

    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>

    <script>

        function addTask() {

            let value = document.getElementById("input").value;

            if (value == "") {
                document.getElementById("nm").innerHTML="Please enter a task"

                
                return;
            }

            let li = document.createElement("li");

            li.innerText = value;

            // Complete button
            let completeBtn = document.createElement("button");
            completeBtn.innerText = "Complete";

            completeBtn.onclick = function () {
                li.style.textDecoration = "line-through";
            };

            // Remove button
            let removeBtn = document.createElement("button");
            removeBtn.innerText = "Remove";

            removeBtn.onclick = function () {
                li.remove();
            };

            li.appendChild(completeBtn);
            li.appendChild(removeBtn);

            document.getElementById("list").appendChild(li);

            document.getElementById("input").value = "";
        }

    </script>

</body>
</html>
